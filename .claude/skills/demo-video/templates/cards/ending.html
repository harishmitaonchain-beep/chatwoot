<!doctype html>
<!-- Brand ending: Chatwoot lockup reveal (mark, then wordmark wipe) and an optional line under it.
     Params: { accent, line } -->
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script src="base.js"></script>
<style>
  #lockup { position: absolute; left: 50%; top: 46%; width: 700px; transform: translate(-50%, -50%); }
  #lockup img { display: block; width: 100%; }
  #word { position: absolute; inset: 0; }
  #line { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font: 500 40px/1.3 Inter; color: var(--muted); }
</style>
<body>
<canvas id="mosaic"></canvas>
<div id="lockup">
  <img id="full" src="../../assets/logo/chatwoot-logo-lockup.svg">
</div>
<div id="line"></div>
<script>
  const P = PARAMS;
  document.body.dataset.accent = P.accent || 'blue';
  document.getElementById('line').textContent = P.line || '';
  const mosaic = document.getElementById('mosaic');
  drawMosaic(mosaic, { seed: 3 });
  const full = document.getElementById('full');
  window.DURATION = 4.2;
  window.renderAt = t => {
    // Mark fades in first, then the wordmark wipes in left to right (mark is the first ~22% of the lockup).
    const mark = k(t, 0.2, 0.5);
    const wipe = 22 + 78 * k(t, 0.75, 1.1);
    full.style.opacity = mark;
    full.style.clipPath = `inset(0 ${100 - wipe}% 0 0)`;
    const s = 0.97 + 0.03 * k(t, 0.2, 2.2);
    document.getElementById('lockup').style.transform = `translate(-50%, -50%) scale(${s})`;
    const line = document.getElementById('line');
    line.style.opacity = k(t, 1.7, 0.6);
    line.style.transform = `translateY(${(1 - k(t, 1.7, 0.6)) * 16}px)`;
  };
</script>
</body>
