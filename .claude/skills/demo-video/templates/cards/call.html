<!doctype html>
<!-- Voice call scene, modelled on the chatwoot.com Voice section card:
     incoming -> ongoing (timer, recording waveform) -> ended (player, transcript) -> optional outbound.
     It is an illustration, like the website's; the real call record is shown in the product beat after it.
     Params: { accent, caller: {name, place, flag, phone, avatar}, agent, duration, thread, transcript: [[who, text]],
               outbound?: {name, place, flag, phone, avatar, line} } -->
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script src="base.js"></script>
<style>
  #wrap { position: absolute; left: 50%; top: 50%; width: 400px; transform: translate(-50%, -50%) scale(1.75); }
  #card { position: relative; overflow: hidden; border-radius: 14px; }
  .state { position: absolute; left: 0; right: 0; top: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .meta { height: 40px; font: 400 12.5px/1 Inter; color: var(--muted); }
  .meta .where { display: flex; align-items: center; gap: 7px; }
  .meta .tag { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .meta .tag svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .who { padding: 4px 16px 16px; display: flex; align-items: center; gap: 12px; }
  .who img { width: 48px; height: 48px; border-radius: 9px; object-fit: cover; }
  .who .name { font: 600 15px/1.3 Inter; }
  .who .phone { font: 400 13px/1.4 Inter; color: var(--muted); letter-spacing: .02em; }
  .who .btns { margin-left: auto; display: flex; gap: 10px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .btn svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.accept { background: #12946a; }
  .btn.decline { background: #e5484d; }
  .btn.mute { background: #dcf4e8; } .btn.mute svg { stroke: #12946a; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #12946a; }
  .wave { margin: 0 16px 14px; height: 40px; border-radius: 9px; background: #f0fbf6; border: 1px solid #dcf4e8; display: flex; align-items: center; gap: 3px; padding: 0 12px; }
  .wave i { display: block; width: 3px; border-radius: 2px; background: #12946a; }
  .wave b { margin-left: auto; font: 500 11.5px/1 Inter; color: #12946a; }
  .foot { height: 44px; border-top: 1px solid var(--line); font: 400 12.5px/1 Inter; color: var(--muted); }
  .ended-head { padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .ended-head .ic { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; }
  .ended-head .ic svg { width: 17px; height: 17px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
  .ended-head .t1 { font: 600 14px/1.3 Inter; } .ended-head .t2 { font: 400 12.5px/1.4 Inter; color: var(--muted); }
  .ended-head .by { margin-left: auto; text-align: right; font: 400 11px/1.3 Inter; color: var(--muted); }
  .ended-head .by strong { display: block; font: 600 12.5px/1.3 Inter; color: var(--ink); }
  .box { margin: 12px 16px 16px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .player { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fafafa; border-bottom: 1px solid var(--line); font: 400 12px/1 Inter; color: var(--muted); }
  .player .play { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .player .play svg { width: 11px; height: 11px; fill: #fff; }
  .player .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--line); position: relative; }
  .player .bar span { position: absolute; left: 0; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: #12946a; }
  .lines { padding: 10px 12px; display: grid; gap: 8px; font: 400 12.5px/1.45 Inter; }
  .lines div { display: grid; grid-template-columns: 52px 1fr; }
  .lines .w { color: var(--muted); } .lines .agent .w { color: #12946a; font-weight: 500; }
</style>
<body>
<canvas id="mosaic"></canvas>
<div id="wrap"><div id="card" class="card"></div></div>
<script>
  const P = PARAMS;
  document.body.dataset.accent = P.accent || 'green';
  const mosaic = document.getElementById('mosaic');
  drawMosaic(mosaic, { seed: 9 });
  const av = f => `../../assets/avatars/${f}`;
  const svg = (d, vb = 24) => `<svg viewBox="0 0 ${vb} ${vb}">${d}</svg>`;
  const PHONE = ICONS.phone;
  const IN = '<path d="M16 2v6h6"/><path d="m22 2-6 6"/>' + PHONE;
  const HANG = '<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07M5.6 13.4A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="M22 2 2 22"/>';
  const MIC = '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 17v5"/>';
  const head = (c, tag) => `<div class="row meta"><span class="where">${c.flag || ''} ${c.place}</span><span class="tag">${tag}</span></div>`;
  const who = (c, btns) => `<div class="who"><img src="${av(c.avatar)}"><div><div class="name">${c.name}</div><div class="phone">${c.phone}</div></div><div class="btns">${btns}</div></div>`;
  const foot = `<div class="row foot"><span>Go to conversation thread</span><span># ${P.thread || ''}</span></div>`;
  const c = P.caller;
  const bars = Array.from({ length: 34 }, () => '<i></i>').join('');
  const states = {
    incoming: `${head(c, `<span style="color:#12946a" class="tag">${svg(IN)} Incoming call</span>`)}${who(c, `<div class="btn accept"><div class="ring"></div>${svg(PHONE)}</div><div class="btn decline">${svg(HANG)}</div>`)}${foot}`,
    ongoing: `${head(c, '<span id="timer" style="font:500 14px/1 Inter;color:var(--ink)">00:00</span>')}${who(c, `<div class="btn mute">${svg(MIC)}</div><div class="btn decline">${svg(HANG)}</div>`)}<div class="wave">${bars}<b>Recording</b></div>${foot}`,
    ended: `${foot.replace('class="row foot"', 'class="row foot" style="border-top:0;border-bottom:1px solid var(--line)"')}
      <div class="ended-head"><div class="ic">${svg(IN)}</div><div><div class="t1">Call ended</div><div class="t2">${P.duration} · Inbound</div></div>
      <div class="by">Answered by<strong>${P.agent}</strong></div></div>
      <div class="box"><div class="player"><span class="play">${svg('<path d="M6 4l14 8-14 8z"/>')}</span><span class="bar"><span></span></span><span>${P.duration}</span></div>
      <div class="lines">${(P.transcript || []).map(([w, t], i) => `<div class="${w === P.agent.split(' ')[0] ? 'agent' : ''}" data-i="${i}"><span class="w">${w}</span><span>${t}</span></div>`).join('')}</div></div>`,
  };
  if (P.outbound) states.outbound = `${head(P.outbound, `${svg(PHONE)} ${P.outbound.line || 'Outbound call'}`)}${who(P.outbound, `<div class="btn accept"><div class="ring"></div>${svg(PHONE)}</div>`)}${foot.replace(P.thread, P.outbound.thread || P.thread)}`;

  const card = document.getElementById('card');
  card.innerHTML = Object.entries(states).map(([id, html]) => `<div class="state" id="s-${id}">${html}</div>`).join('');
  const height = id => document.getElementById(`s-${id}`).offsetHeight;

  // Timeline (seconds): when each state takes over.
  const T = { incoming: 0.6, ongoing: 3.4, ended: 7.2, outbound: 11.2 };
  const order = Object.keys(states);
  window.DURATION = P.outbound ? 14.2 : 11.2;

  window.renderAt = t => {
    const wrap = document.getElementById('wrap');
    const appear = k(t, 0, 0.6);
    wrap.style.opacity = appear;
    wrap.style.transform = `translate(-50%, calc(-50% + ${(1 - appear) * 24}px)) scale(1.75)`;
    // Cross-fade states and ease the card height between them.
    let h = height(order[0]);
    order.forEach((id, i) => {
      const next = order[i + 1];
      const shown = (i === 0 ? 1 : k(t, T[id], 0.45)) * (next ? 1 - k(t, T[next], 0.45) : 1);
      document.getElementById(`s-${id}`).style.opacity = shown;
      if (i > 0) h = lerp(h, height(id), k(t, T[id], 0.45));
    });
    card.style.height = `${h}px`;
    // Ringing pulse on the answer buttons.
    document.querySelectorAll('.ring').forEach(r => {
      const ph = (t * 1.1) % 1;
      r.style.transform = `scale(${1 + ph * 0.55})`;
      r.style.opacity = 0.7 * (1 - ph);
    });
    // Live timer and waveform while the call is ongoing.
    const timer = document.getElementById('timer');
    if (timer) { const s = Math.max(0, Math.floor(t - T.ongoing)); timer.textContent = `00:${String(s).padStart(2, '0')}`; }
    document.querySelectorAll('#s-ongoing .wave i').forEach((b, i) => {
      const v = 0.25 + 0.75 * Math.abs(Math.sin(t * 7 + i * 0.9) * Math.cos(t * 3.1 + i * 0.37));
      b.style.height = `${Math.round(6 + v * 22)}px`;
    });
    // Transcript lines arrive one by one after the call ends.
    document.querySelectorAll('.lines div').forEach(d => {
      const p = k(t, T.ended + 0.7 + Number(d.dataset.i) * 0.75, 0.4);
      d.style.opacity = p;
      d.style.transform = `translateY(${(1 - p) * 6}px)`;
    });
    const knob = document.querySelector('.player .bar span');
    if (knob) knob.style.left = `${Math.min(1, Math.max(0, (t - T.ended - 0.6) / 6)) * 100}%`;
  };
</script>
</body>
